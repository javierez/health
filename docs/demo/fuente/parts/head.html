<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salud · guía completa</title>
<style>
  :root { --ink:#111827; --mute:#6b7280; --line:#e5e7eb; --bg:#f9fafb; --amber:#f59e0b; --amberbg:#fffbeb; --amberline:#fde68a; }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.55 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif; color:var(--ink); background:var(--bg) }
  nav { position:fixed; top:0; left:0; bottom:0; width:230px; padding:28px 18px; border-right:1px solid var(--line); background:#fff; overflow:auto }
  nav h1 { font-size:20px; margin:0 0 2px; letter-spacing:-.02em }
  nav p { margin:0 0 18px; color:var(--mute); font-size:12px }
  nav a { display:block; padding:5px 10px; border-radius:999px; color:var(--ink); text-decoration:none; font-size:13.5px }
  nav a:hover { background:#f3f4f6 }
  nav a span { color:var(--mute); font-variant-numeric:tabular-nums; margin-right:6px }
  main { margin-left:230px; padding:40px 48px 120px; max-width:1180px }
  section { margin:0 0 64px; animation:rise .5s both }
  @keyframes rise { from { opacity:0; transform:translateY(8px) } }
  h2 { font-size:24px; letter-spacing:-.02em; margin:0 0 4px }
  h2 + .lead { color:var(--mute); margin:0 0 20px }
  h3 { font-size:15px; margin:26px 0 8px }
  .grid { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:28px; align-items:start }
  .grid.even { grid-template-columns:1fr 1fr }
  figure { margin:0 }
  figure img { width:100%; display:block; border:1px solid var(--line); border-radius:14px; background:#fff }
  figure a { display:block }
  figcaption { font-size:12px; color:var(--mute); margin-top:6px }
  ul { margin:0; padding-left:18px }
  li { margin:3px 0 }
  table { width:100%; border-collapse:collapse; font-size:14px; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top }
  th { font-weight:600; background:#f9fafb; font-size:12.5px; color:var(--mute) }
  tr:last-child td { border-bottom:0 }
  code { font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace; background:#f3f4f6; padding:1px 5px; border-radius:5px }
  details { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-top:10px }
  details summary { cursor:pointer; font-weight:500 }
  details > *:not(summary) { margin-top:8px }
  .tag { display:inline-block; font-size:11.5px; padding:1px 8px; border-radius:999px; background:#f3f4f6; color:var(--mute); margin-left:6px; vertical-align:2px }
  .tag.amber { background:var(--amberbg); color:#92400e; border:1px solid var(--amberline) }
  .note { background:var(--amberbg); border:1px solid var(--amberline); border-radius:12px; padding:10px 14px; font-size:14px; margin:12px 0 }
  .steps { counter-reset:s; list-style:none; padding:0 }
  .steps li { counter-increment:s; padding-left:30px; position:relative; margin:8px 0 }
  .steps li::before { content:counter(s); position:absolute; left:0; top:1px; width:20px; height:20px; border-radius:999px; background:var(--ink); color:#fff; font-size:11.5px; display:grid; place-items:center }
  .phone { width:340px; background:#efeae2; border-radius:28px; border:8px solid #111827; padding:14px 10px 18px; font-size:13.5px }
  .phone .top { background:#075e54; color:#fff; margin:-14px -10px 12px; padding:12px 14px; border-radius:20px 20px 0 0; font-weight:600; font-size:14px }
  .phone .top small { display:block; font-weight:400; opacity:.8; font-size:11.5px }
  .b { background:#fff; border-radius:10px; padding:7px 10px 4px; margin:0 40px 8px 0; box-shadow:0 1px .5px rgba(0,0,0,.13); white-space:pre-wrap }
  .b.me { background:#d9fdd3; margin:0 0 8px 40px }
  .b time { display:block; text-align:right; font-size:10.5px; color:#667781 }
  .day { text-align:center; margin:6px 0 10px }
  .day span { background:#fff; border-radius:8px; padding:3px 10px; font-size:11.5px; color:#54656f }
  .row { display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start }
  .shots { display:grid; grid-template-columns:repeat(3,1fr); gap:16px }
  .shots figure img { aspect-ratio:auto }
  @media (max-width:900px) { nav { display:none } main { margin:0; padding:24px } .grid, .grid.even, .shots { grid-template-columns:1fr } }
  .shots.two { grid-template-columns:repeat(2,1fr) }
  .shots.four { grid-template-columns:repeat(4,1fr) }
  .tall { max-height:560px; overflow:auto; border:1px solid var(--line); border-radius:14px }
  .tall img { border:0; border-radius:0 }
</style>
